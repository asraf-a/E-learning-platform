databases:
  - name: educa-db
    databaseName: educa
    user: educa
    plan: free

services:
  - type: web
    name: educa-platform
    runtime: python
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "cd educa && daphne -b 0.0.0.0 -p $PORT educa.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: educa.settings.pro
      - key: DATABASE_URL
        fromDatabase:
          name: educa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "true"
