{% extends "base.html" %}

{% block title %}
    Edit "{{ course.title }}"
{% endblock %}

{% block content %}
    <h1>Edit "{{ course.title }}"</h1>
    <div class="module">
        <h2>Course modules</h2>
        <form method="post">
            {{ formset.management_form }}
            {{ formset }}
            {% csrf_token %}
            <p style="margin-top: 20px;"><input type="submit" value="Save modules"></p>
        </form>
    </div>
{% endblock %}
