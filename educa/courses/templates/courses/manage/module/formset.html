{% extends "base.html" %}

{% block title %}
    Edit "{{ course.title }}"
{% endblock %}

{% block content %}

<h1>Edit "{{ course.title }}"</h1>

<div class="module">
    <h2>Course modules</h2>
    <form method="post">
        {{ formset.management_form }}
        {{ formset.as_p }}
        {% csrf_token %}

        <p>
            <input type="submit" value="Save modules">
            <a href="{% url 'manage_course_list' %}">Cancel</a>
        </p>
    </form>
</div>

{% endblock %}
